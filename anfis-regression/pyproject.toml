[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anfis-regression"
version = "0.1.0"
description = "Five-layer Sugeno ANFIS in PyTorch with Jang's hybrid optimiser, for explainable regression"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["anfis", "neuro-fuzzy", "fuzzy-logic", "explainable-ai", "regression", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
fuzzy = ["scikit-fuzzy>=0.4"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "tabulate>=0.9",
    "scikit-fuzzy>=0.4",
]

[project.urls]
Homepage = "https://github.com/your-username/anfis-regression"
Issues = "https://github.com/your-username/anfis-regression/issues"

[tool.setuptools]
packages = ["anfis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# UP0xx (PEP 585/604 syntax) is off on purpose: the package supports Python 3.9.
select = ["E", "F", "I", "B"]
ignore = ["E741", "B008"]
